ignore_errors = true

[tool.pytest.ini_options]
junit_family = "xunit2"
testpaths = ["src/experimaestro"]
norecursedirs = ["node_modules"]
log_format = "[%(levelname)s] %(asctime)s %(name)s [%(process)d/%(threadName)s]: %(message)s"
log_cli_format = "[%(levelname)s] %(asctime)s %(name)s [%(process)d/%(threadName)s]: %(message)s"
log_date_format = "%H:%M:%S"
log_cli_date_format = "%H:%M:%S"
addopts = "--order-dependencies --ignore-unknown-dependency"
timeout = 300

markers = [
    # Core foundation (no dependencies)
    "types: Type system, type hierarchy, validation tests",
    "config: Config object behavior, parameters, fields tests",
    # Identifier system (depends on types/config)
    "identifier: Identifier computation, hashing, stability tests",
    "serialization: Config/task serialization, state dict handling tests",
    # Task execution (depends on identifiers)
    "tasks: Basic task execution, submission tests",
    "dependencies: Dependency resolution, explicit/implicit deps tests",
    "dynamic: Dynamic task outputs, callbacks, watch_output tests",
    # Advanced execution (depends on tasks)
    "resumable: ResumableTask, GracefulTimeout, checkpoints, retries tests",
    "tokens: Token management, concurrency limiting, locks tests",
    "transient: Transient (non-cached) execution tests",
    # Infrastructure
    "connectors: Local/SSH connectors tests",
    "launchers: Direct/SLURM launchers tests",
    "state: Workspace state, remote state providers tests",
    # Utilities & misc
    "workspace: Workspace triggers, settings tests",
    "deprecation: DeprecatedAttribute, migration tests",
    "carbon: Carbon tracking tests (optional feature)",
    "slow: Long-running tests",
    "ui(*interfaces): UI feature test restricted to these interfaces (tui, web)",
    "ui_gap(*interfaces, reason): known defect of these interfaces (strict xfail)",
    "protocol: Filesystem protocol tests (crash points, concurrent actors)",
    "deviation(id): reproduces a known deviation (D-xx) of the filesystem protocol spec",
]

[dependency-groups]
browser = [
    "playwright>=1.50",
]
dev = [
    "ruff>=0.17",
    "mkdocs>=1.6.1",
    "vulture>=2.14",
]

[tool.vulture]
paths = ["src/experimaestro", "vulture_whitelist.py"]
exclude = ["*/tests/*", "*/version.py"]
min_confidence = 80
sort_by_size = true
# Ignore Click CLI decorators and Textual framework decorators
ignore_decorators = [
    "@click.command",
    "@click.group",
    "@click.option",
    "@*.command",
    "@*.group",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "C90",    # mccabe complexity
    "T20",    # flake8-print
    "UP006",  # list[int], not List[int]
    "UP007",  # X | Y, not Union[X, Y]
    "UP035",  # no deprecated typing imports
    "UP045",  # X | None, not Optional[X]
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Standalone helper scripts are CLIs: printing to stdout is intended.
"scripts/*" = ["T20"]
"dev/*" = ["T20"]
# Checks that the legacy typing forms (List, Optional, ...) still work
"src/experimaestro/tests/core/test_legacy_typing.py" = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.mccabe]
max-complexity = 25
