[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "experimaestro"
authors = [
    {name = "Benjamin Piwowarski", email = "benjamin@piwowarski.fr"}
]
description = "Experimaestro is a computer science experiment manager"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
keywords = ["experiment manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "arpeggio >=2,<3",
    "attrs >=23.1.0,<24",
    "click >=8",
    "decorator >=5,<6",
    "docstring-parser >=0.15,<1",
    "fastapi >=0.109,<1",
    "filelock>=3.16,<5",
    "httpx >=0.26,<1",
    "humanfriendly >=10",
    "jinja2 >=3",
    "marshmallow >=3.20,<4",
    "pydantic >=2.6",
    "psutil >=7,<8",
    "pyparsing >=3.1,<4",
    "pyperclip >=1.8,<2",
    "pytools >=2023.1.1,<2024",
    "pyyaml >=6.0.1,<7",
    "requests >=2.31,<3",
    "rpyc >=5,<7",
    "sortedcontainers >=2.4,<3",
    "termcolor >=2.3,<3",
    "textual >=6",
    "textual-fspicker >=0.0.11",
    "tqdm >=4.66.1,<5",
    "typing-extensions >=4.2; python_version < \"3.12\"",
    "uvicorn[standard] >=0.27,<1",
    "watchdog >=2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pytest>=8.4.1",
    "pytest-dependency>=0.6.0",
    "pytest-order>=1.0.0",
    "pytest-timeout>=2.4.0",
    "textual-dev>=1.8.0",
    "docutils>=0.18",
    "Pygments>=2.15",
]
docs = [
    "sphinx>=6",
    "myst-parser>=2.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-codeautolink>=0.15",
    "sphinx-copybutton>=0.5",
]
huggingface = [
    "huggingface-hub>0.17",
]
ssh = [
    "paramiko>=3.3",
    "fabric>=3",
]
carbon = [
    # CodeCarbon for Linux/Windows (requires Intel RAPL or NVIDIA GPU)
    "codecarbon>=2.0; sys_platform != 'darwin'",
    # Zeus for macOS Apple Silicon (uses IOKit API via zeus[apple])
    "zeus[apple]>=0.10.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/experimaestro/experimaestro-python"
Documentation = "https://experimaestro-python.readthedocs.io/"
Repository = "https://github.com/experimaestro/experimaestro-python"
"Bug Tracker" = "https://github.com/experimaestro/experimaestro-python/issues"

[project.scripts]
experimaestro = "experimaestro.__main__:main"

[project.entry-points."experimaestro.process"]
local = "experimaestro.connectors.local:LocalProcess"
slurm = "experimaestro.launchers.slurm:BatchSlurmProcess"

[project.entry-points."experimaestro.connectors"]
local = "experimaestro.connectors.local:LocalConnector"
ssh = "experimaestro.connectors.ssh:SshConnector"

[project.entry-points."experimaestro.tokens"]
unix = "experimaestro.tokens:CounterToken"

[project.entry-points."experimaestro.launchers"]
direct = "experimaestro.launchers.direct:DirectLauncher"
slurm = "experimaestro.launchers.slurm:SlurmLauncher"

[project.entry-points.mypy]
experimaestro = "experimaestro.mypy:plugin"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/experimaestro/version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/app",
    "/.agents",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/experimaestro"]

# webui/data is committed and ships as ordinary package data; it must NOT be
# force-included as well, or hatchling adds each file twice (build failure).
[tool.hatch.build.targets.wheel.force-include]
"src/experimaestro/sphinx/static/experimaestro.css" = "experimaestro/sphinx/static/experimaestro.css"
"src/experimaestro/tui/app.tcss" = "experimaestro/tui/app.tcss"

[tool.pydocstyle]
match-dir = '(?!tests)(?!resources)(?!docs)[^\.].*'
match = '(?!test)(?!setup)[^\._].*\.py'
inherit = false
ignore = "D200,D203,D213,D406,D407"

[tool.mypy]
python_version = "3.11"
plugins = ["experimaestro.mypy"]
# Untyped functions are not checked: no need to say it for each of them
disable_error_code = ["annotation-unchecked"]
warn_unused_ignores = true

# Third-party modules without type information
[[tool.mypy.overrides]]
module = [
    "arpeggio.*", "codecarbon.*", "docutils.*", "huggingface_hub.*",
    "humanfriendly.*", "IPython.*", "ipywidgets.*", "lightning_fabric.*",
    "psutil.*", "pynvml.*", "pyperclip.*", "pytorch_lightning.*", "rpyc.*",
    "sortedcontainers.*", "sphobjinv.*", "torch.*", "torchmetrics.*", "tqdm.*",
    "xpm_fake_module.*", "yaml.*", "zeus.*", "zeus_apple_silicon.*",
]
ignore_missing_imports = true

# Uses a syntax newer than the target version
[[tool.mypy.overrides]]
module = ["sphinx.*"]
follow_imports = "skip"

# Ratchet: modules that do not type-check yet. mypy runs on the whole package
# (pre-commit, CI); remove a module from this list once it is clean, and never
# add one.
[[tool.mypy.overrides]]
module = [
